[build]
  command = "cd apps/web && npm run build"
  publish = "apps/web/build/client"
  functions = "apps/web/netlify/functions"

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/content/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/konten-gratis/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  port = 4000
  framework = "vite"